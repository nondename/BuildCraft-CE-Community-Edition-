name: Build LoM BCCE 1.20.1 Forge

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-lom-1201.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x builds/legacy/gradlew scripts/validate-1.20.1-target.py

      - name: Validate 1.20.1 target
        run: python scripts/validate-1.20.1-target.py --source-root version-src/1.20.1-forge

      - name: Build 1.20.1 Forge
        shell: bash
        run: |
          set -euo pipefail
          cd builds/legacy
          ./gradlew --no-daemon --console=plain --stacktrace ':1.20.1-forge:buildAndCollect'

      - name: Show collected JARs
        run: find build -type f -name '*.jar' -print -exec ls -lh {} \;

      - name: Upload BCCE 1.20.1 Forge JARs
        uses: actions/upload-artifact@v4
        with:
          name: bcce-1.20.1-forge-lom
          path: build/*/*.jar
          if-no-files-found: error
          retention-days: 14
